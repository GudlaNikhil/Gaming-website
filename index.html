<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="index.css">
    <title>Gaming website</title>
</head>
<body>
    <div class="container">
        <div class="top-header">
            <img class="icon-img" src="/icons/icons8-home-50.png">
                <img class="icon-img" src="/icons/icons8-new-50.png">
                    <img class="icon-img" src="/icons/icons8-fire-50.png">
                        <img class="icon-img" src="/icons/icons8-multiplayer-game-50.png">
                            <img class="icon-img" src="/icons/icons8-leaderboard-50.png">
                            <img class="icon-img" src="/icons/icons8-mission-50.png">
                        <img class="icon-img" src="/icons/icons8-first-place-ribbon-50.png">
                    <img class="icon-img" src="/icons/icons8-coins-50.png">
                <button class="night-mode" onclick="theme()"><img class="icon-img"
                 src="/icons/icons8-do-not-disturb-ios-50.png"></button>
            <img class="icon-img" src="/icons/icons8-time-machine-50.png">
        <img class="icon-img" src="/icons/icons8-test-account-50.png">
    </div>
        <div class="header-container">
            <div class="strategy-div">Strategy Games<img class="icon-cat" src="/images/brain.png"></div>
                <div class="racing-div">Racing Games<img class="icon-cat" src="/images/racing.png"></div>
                    <div class="sports-div">Sports<img class="icon-cat" src="/images/football.png"></div>
                <div class="multiplayer-div">Multiplayer mode<img class="icon-cat" src="/images/multiplayer.png"></div>
            <div class="casual-div">Casual Play<img class="icon-cat" src="/images/causle.png"></div>
        </div>
    <div class="promotion">PLAY 100% FREE GAMES HERE.</div>
        <div class="type1-games">
            <div class="car-racing"><img class="car-racing-img"
                 src="images/Neon Coastal Car Racing Showdown.png">
                    <video muted loop playsinline class="car-racing-vid">
                        <source src="/images/car-racing-video.mp4" 
                            type="video/mp4"></video></div>
            <div class="type1-flex">
    <div class="wordle"><img class="wordle-img" src="images/Neon Wordle Challenge Board.png"></div>
            <div class="agar"><img class="agar-img" src="images/Neon Agar.io Arena Showdown.png"></div>
        </div>
        <div class="type11-flex">
                <div class="slither"><img class="slither-img" src="images/Neon Slither.io Arena Showdown.png"></div>
                <div class="two-zero"><img class="two-zero-img" src="images/Neon 2048 Puzzle Arena.png"></div>
            </div>
            <div class="chess"><img class="chess-img" src="images/Regal Chess Arena Showdown.png"></div></div>
        </div>

        <div class="type2-games">
            <div class="type2-flex">
                <div class="tetris"><img class="tetris-img" src="images/Neon Tetris Puzzle Showdown.png"></div>
                    <div class="geo"><img class="geo-img" src="images/GeoGuessr World Explorer Collage.png"></div>
            </div>
        <div class="football"><img class="football-img" src="images/Football Penalty Showdown.png">
                <video muted loop playsinline class="football-vid">
                    <source src="/images/football-video.mp4" 
                        type="video/mp4"></video></div>
                <div class="cricket"><img class="cricket-img" src="images/Cricket Batting_ Stadium Strike.png">
                    <video muted loop playsinline class="cricket-vid"><source src="/images/cricket-videp.mp4"
                         type="video/mp4"></video></div>
            <div class="type22-flex">
                <div class="sudoko"><img class="sudoko-img" src="images/Cinematic Sudoku Desk Game Banner.png"></div>
            <div class="mine"><img class="mine-img" src="images/Minesweeper_ Explosive Pixel Adventure.png"></div>
        </div>
    </div>

        <div class="type3-games">
            <div class="snake"><img class="snake-img" src="images/Neon Snake Arcade Showdown.png"></div>
            <div class="type3-flex">
                <div class="knife"><img class="knife-img" src="images/Knife Throw_ Target Strike.png"></div>
                <div class="jump"><img class="jump-img" src="images/Neon Helix Jump Tower.png"></div>
            </div>
            <div class="type33-flex">
                <div class="typing"><img class="typing-img" src="images/Neon Typing Speed Challenge.png"></div>
                <div class="rock"><img class="rock-img" src="images/Neon Rock Paper Scissors Showdown.png"></div>
            </div>
            <div class="bird"><img class="bird-img" src="images/Flappy Bird_ Pixel Sky Dash.png"></div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
